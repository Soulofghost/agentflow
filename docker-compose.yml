version: '3.8'

services:
  agentflow:
    build: .
    container_name: agentflow-orchestrator
    ports:
      - "8003:8003"
    volumes:
      - agentflow-data:/app/backend/data
    environment:
      - PORT=8003
      - ENVIRONMENT=production
    restart: unless-stopped

volumes:
  agentflow-data:
